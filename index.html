<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <div class="header-icon">🎓</div>

        <h1>Student Task Manager</h1>

        <p>Stay organized. Stay productive.</p>

        <button id="themeToggle"
                class="theme-toggle"
                type="button">
            🌙
        </button>
    </header>


    <!-- DASHBOARD -->
    <section class="dashboard">

        <div class="stat">
            <span class="stat-icon">📋</span>
            <p>Total Tasks</p>
            <h3 id="totalTasks">0</h3>
        </div>

        <div class="stat">
            <span class="stat-icon">⏳</span>
            <p>Pending</p>
            <h3 id="pendingTasks">0</h3>
        </div>

        <div class="stat">
            <span class="stat-icon">✓</span>
            <p>Completed</p>
            <h3 id="completedTasks">0</h3>
        </div>

        <div class="stat">
            <span class="stat-icon">📈</span>
            <p>Progress</p>
            <h3 id="progressTasks">0%</h3>
        </div>

    </section>


    <!-- OVERALL PROGRESS -->
    <section class="progress-section">

        <div class="progress-header">
            <div>
                <h2>Overall Progress</h2>
                <p id="progressText">Keep completing your tasks!</p>
            </div>

            <strong id="progressPercent">0%</strong>
        </div>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>

    </section>


    <!-- ADD TASK -->
    <section class="task-form">

        <div class="section-title">
            <h2>＋ Add New Task</h2>
            <p>Create a new assignment or task.</p>
        </div>

        <div class="form-grid">

            <div class="input-group">
                <label for="taskInput">Task Name</label>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="e.g. Complete C Programming Assignment"
                >
            </div>


            <div class="input-group">
                <label for="subject">Subject</label>

                <select id="subject">
                    <option>C Programming</option>
                    <option>Mathematics</option>
                    <option>Physics</option>
                    <option>Web Development</option>
                    <option>Other</option>
                </select>
            </div>


            <div class="input-group">
                <label for="priority">Priority</label>

                <select id="priority">
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                </select>
            </div>


            <div class="input-group">
                <label for="dueDate">Due Date</label>

                <input
                    type="date"
                    id="dueDate"
                >
            </div>

        </div>

        <button
            class="add-btn"
            id="addTaskButton"
            type="button">
            ＋ Add Task
        </button>

    </section>


    <!-- SEARCH -->
    <section class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search tasks..."
        >

    </section>


    <!-- FILTERS -->
    <div class="filters">

        <button class="filter-btn active"
                data-filter="all">
            All
        </button>

        <button class="filter-btn"
                data-filter="pending">
            Pending
        </button>

        <button class="filter-btn"
                data-filter="completed">
            Completed
        </button>

        <button class="filter-btn"
                data-filter="high">
            🔴 High Priority
        </button>

    </div>


    <!-- TASKS -->
    <section class="tasks-section">

        <div class="tasks-heading">
            <div>
                <h2>📚 My Tasks</h2>
                <p>Manage your assignments and deadlines.</p>
            </div>

            <span id="taskCount">0 tasks</span>
        </div>

        <div id="taskList"></div>

    </section>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
